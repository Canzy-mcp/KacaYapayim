name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: node scripts/write-dependency-inventory.mjs
      - run: node scripts/check-dependency-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-evidence
          path: |
            tmp/dependency-inventory.json
            tmp/dependency-audit.json
          retention-days: 14
